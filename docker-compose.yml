version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_PATH=/app/chroma_data
      - DOCS_PATH=/app/docs
    volumes:
      - ./docs:/app/docs:ro
      - ./pages:/app/pages:ro
      - ./widget:/app/widget:ro
      - ./operator:/app/operator:ro
      - chroma_data:/app/chroma_data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m channels.telegram_bot
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m jobs.alerts
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./widget:/usr/share/nginx/html/widget:ro
      - ./operator:/usr/share/nginx/html/operator:ro
    depends_on:
      - api

volumes:
  redis_data:
  chroma_data:
