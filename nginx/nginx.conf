server {
    listen 80;
    server_name _;

    # Widget static files — served with CORS so any page can load widget.js
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # Operator dashboard
    location /operator/ {
        alias /usr/share/nginx/html/operator/;
        try_files $uri $uri/ /operator/index.html;
    }

    # Proxy all /api/* to the FastAPI container
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket support (escalation signalling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Docs
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
