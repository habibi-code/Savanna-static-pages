<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Savanna Learning Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Iframe-specific overrides — full-height shell */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
  </style>
</head>
<body>

<!-- Skip link -->
<a href="#chat-input" class="skip-link">Skip to chat input</a>

<!-- ── Escalation consent modal ──────────────────────────── -->
<div id="escalation-modal" class="modal-backdrop" hidden
     role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Share your screen with a human agent?</h2>
    <p>
      To get personalised help, an operator will view your screen.
      You will be asked to choose what to share. You can stop at any time.
    </p>
    <div class="modal-actions">
      <button type="button" id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
      <button type="button" id="modal-confirm-btn" class="btn btn-primary">Share &amp; Connect</button>
    </div>
  </div>
</div>

<!-- ── Widget shell ───────────────────────────────────────── -->
<main class="widget-shell" role="main" aria-label="Savanna Learning Assistant">

  <!-- Header -->
  <header class="widget-header" role="banner">
    <h1 id="widget-title">Savanna Assistant</h1>

    <!-- Language toggle -->
    <button type="button" id="lang-toggle-btn" class="icon-btn lang-toggle"
            aria-pressed="false"
            aria-label="Switch to Amharic"
            title="Switch language / ቋንቋ ቀይር">
      EN
    </button>

    <!-- Minimise -->
    <button type="button" id="minimize-btn" class="icon-btn"
            aria-label="Minimise assistant">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Close -->
    <button type="button" id="close-btn" class="icon-btn"
            aria-label="Close assistant">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- ── Error / alert zone ──────────────────────────────── -->
  <div id="error-zone" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- ── Ticket confirmation zone ───────────────────────── -->
  <div id="ticket-zone" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Message area ────────────────────────────────────── -->
  <div class="message-area" aria-label="Conversation">
    <ul id="message-list"
        role="log"
        aria-live="polite"
        aria-atomic="false"
        aria-label="Conversation"
        aria-busy="false">
    </ul>
  </div>

  <!-- ── Input area ──────────────────────────────────────── -->
  <section class="input-area" aria-label="Message input">
    <div class="input-wrapper">
      <div class="input-label-wrapper">
        <label id="chat-input-label" for="chat-input" class="input-label">
          Message (English or Amharic)
        </label>
        <textarea
          id="chat-input"
          name="chat-input"
          aria-label="Type your message in English or Amharic"
          aria-describedby="chat-input-label"
          rows="2"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
      </div>

      <div class="input-actions">
        <!-- Voice input -->
        <button type="button" id="voice-btn" class="btn btn-ghost btn-icon"
                aria-label="Start voice input"
                aria-pressed="false"
                title="Voice input">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <!-- Send -->
        <button type="button" id="send-btn" class="btn btn-primary"
                aria-label="Send message"
                disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <span id="send-btn-label">Send</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ── Escalation bar ──────────────────────────────────── -->
  <div class="escalation-bar" role="complementary" aria-label="Human assistance">
    <button type="button" id="escalate-btn"
            aria-label="Escalate to a human agent">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.63 3.42 2 2 0 0 1 3.6 1.26h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l1.06-1.06a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 16z"/>
      </svg>
      <span id="escalate-label">Get human help</span>
    </button>
  </div>

</main>

<script>
/* ════════════════════════════════════════════════════════════
   Savanna Widget — iframe.html script
   WCAG 2.2 AA | zero external JS deps
   ════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── Resolve API base URL from query param ───────────────── */
  const params  = new URLSearchParams(window.location.search);
  const apiUrl  = (params.get('api') || '').replace(/\/$/, '') || '/api';

  /* ── Session & history ───────────────────────────────────── */
  const SESSION_KEY = 'savanna_session_id';
  function uuidv4() {
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  }
  if (!sessionStorage.getItem(SESSION_KEY)) {
    sessionStorage.setItem(SESSION_KEY, uuidv4());
  }
  const sessionId = sessionStorage.getItem(SESSION_KEY);
  const history   = []; // { role: 'user'|'assistant', content: string }

  /* ── Language state ──────────────────────────────────────── */
  const LANG_KEY    = 'savanna_lang';
  let   isAmharic   = localStorage.getItem(LANG_KEY) === 'am';
  let   isListening = false;
  let   recognition = null;

  /* ── DOM refs ────────────────────────────────────────────── */
  const htmlEl        = document.documentElement;
  const widgetTitle   = document.getElementById('widget-title');
  const langToggleBtn = document.getElementById('lang-toggle-btn');
  const closeBtn      = document.getElementById('close-btn');
  const minimizeBtn   = document.getElementById('minimize-btn');
  const messageList   = document.getElementById('message-list');
  const chatInput     = document.getElementById('chat-input');
  const inputLabel    = document.querySelector('.input-label');
  const sendBtn       = document.getElementById('send-btn');
  const sendBtnLabel  = document.getElementById('send-btn-label');
  const voiceBtn      = document.getElementById('voice-btn');
  const escalateBtn   = document.getElementById('escalate-btn');
  const escalateLabel = document.getElementById('escalate-label');
  const errorZone     = document.getElementById('error-zone');
  const ticketZone    = document.getElementById('ticket-zone');
  const escalModal    = document.getElementById('escalation-modal');
  const modalConfirm  = document.getElementById('modal-confirm-btn');
  const modalCancel   = document.getElementById('modal-cancel-btn');

  /* ── i18n strings ────────────────────────────────────────── */
  const i18n = {
    en: {
      title:        'Savanna Assistant',
      langLabel:    'Switch to Amharic',
      langBtn:      'EN',
      inputPlaceholder: 'Message (English or Amharic)',
      send:         'Send',
      voiceStart:   'Start voice input',
      voiceStop:    'Stop voice input',
      escalate:     'Get human help',
      closeLabel:   'Close assistant',
      minimiseLabel:'Minimise assistant',
      thinking:     'Thinking…',
    },
    am: {
      title:        'ሳቫና ረዳት',
      langLabel:    'ወደ እንግሊዝኛ ቀይር',
      langBtn:      'AM',
      inputPlaceholder: 'ፅሑፍ (በእንግሊዝኛ ወይም አማርኛ)',
      send:         'ላክ',
      voiceStart:   'የድምፅ ግቤት ጀምር',
      voiceStop:    'የድምፅ ግቤት አቁም',
      escalate:     'የሰው እርዳታ ያግኙ',
      closeLabel:   'ረዳትን ዝጋ',
      minimiseLabel:'ረዳቱን አሳንስ',
      thinking:     'እያሰብኩ…',
    }
  };

  /* ── Apply language ──────────────────────────────────────── */
  function applyLanguage() {
    const lang = isAmharic ? 'am' : 'en';
    const t    = i18n[lang];
    htmlEl.setAttribute('lang', lang);
    widgetTitle.textContent   = t.title;
    langToggleBtn.textContent = t.langBtn;
    langToggleBtn.setAttribute('aria-label', t.langLabel);
    langToggleBtn.setAttribute('aria-pressed', isAmharic ? 'true' : 'false');
    inputLabel.textContent    = t.inputPlaceholder;
    sendBtnLabel.textContent  = t.send;
    sendBtn.setAttribute('aria-label', t.send + ' message');
    voiceBtn.setAttribute('aria-label', isListening ? t.voiceStop : t.voiceStart);
    escalateLabel.textContent = t.escalate;
    escalateBtn.setAttribute('aria-label', t.escalate + ' — escalate to a human agent');
    closeBtn.setAttribute('aria-label',    t.closeLabel);
    minimizeBtn.setAttribute('aria-label', t.minimiseLabel);
    localStorage.setItem(LANG_KEY, lang);
    if (recognition) recognition.lang = isAmharic ? 'am-ET' : 'en-US';
  }

  applyLanguage();

  /* ── Language toggle ─────────────────────────────────────── */
  langToggleBtn.addEventListener('click', function () {
    isAmharic = !isAmharic;
    applyLanguage();
  });

  /* ── Close / minimise ────────────────────────────────────── */
  closeBtn.addEventListener('click', function () {
    parent.postMessage({ type: 'close' }, '*');
  });
  minimizeBtn.addEventListener('click', function () {
    parent.postMessage({ type: 'close' }, '*');
  });

  /* ── Focus management (from parent) ─────────────────────── */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'focus') {
      chatInput.focus();
    }
  });

  /* ── Send button enable/disable ──────────────────────────── */
  chatInput.addEventListener('input', function () {
    const hasText = chatInput.value.trim().length > 0;
    sendBtn.disabled = !hasText;
    inputLabel.classList.toggle('hidden', hasText);
    /* Auto-resize textarea */
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 128) + 'px';
  });

  /* Keyboard: Ctrl+Enter or Cmd+Enter to send */
  chatInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !sendBtn.disabled) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  /* ── Render helpers ──────────────────────────────────────── */
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, content, citations) {
    const li = document.createElement('li');
    li.className = 'message-item ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.textContent = content;

    const ts = document.createElement('time');
    ts.className = 'message-timestamp sr-only-ts';
    ts.setAttribute('datetime', new Date().toISOString());
    ts.textContent = (role === 'user' ? 'You, ' : 'Assistant, ') + formatTime(new Date());

    li.appendChild(bubble);
    li.appendChild(ts);

    if (citations && citations.length > 0) {
      const citeDiv = document.createElement('div');
      citeDiv.className = 'citations';
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Sources (' + citations.length + ')';
      const citeUl = document.createElement('ul');
      citations.forEach(function (c) {
        const item = document.createElement('li');
        const a = document.createElement('a');
        a.href = c.url || '#';
        a.textContent = c.title || c.url || 'Source';
        if (c.url) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        item.appendChild(a);
        citeUl.appendChild(item);
      });
      details.appendChild(summary);
      details.appendChild(citeUl);
      citeDiv.appendChild(details);
      li.appendChild(citeDiv);
    }

    messageList.appendChild(li);
    li.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return li;
  }

  function showThinking() {
    const li = document.createElement('li');
    li.id = 'thinking-indicator';
    li.setAttribute('aria-label', i18n[isAmharic ? 'am' : 'en'].thinking);
    li.innerHTML = `
      <div class="thinking-indicator" aria-hidden="true">
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
      </div>`;
    messageList.appendChild(li);
    li.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return li;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  function showError(msg) {
    errorZone.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'error-alert';
    div.textContent = msg;
    errorZone.appendChild(div);
    setTimeout(function () { errorZone.innerHTML = ''; }, 8000);
  }

  /* ── Send message ────────────────────────────────────────── */
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    /* Reset input */
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;
    inputLabel.classList.remove('hidden');

    /* Render user bubble */
    appendMessage('user', text, null);

    /* Track in history */
    history.push({ role: 'user', content: text });
    if (history.length > 20) history.splice(0, history.length - 20);

    /* Show loading */
    messageList.setAttribute('aria-busy', 'true');
    const thinkingEl = showThinking();

    /* POST /chat */
    try {
      const res = await fetch(apiUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:    text,
          language:   isAmharic ? 'am' : 'en',
          session_id: sessionId,
          history:    history.slice(-10)
        })
      });

      removeThinking();
      messageList.setAttribute('aria-busy', 'false');

      if (!res.ok) {
        const errText = await res.text().catch(() => 'Unknown error');
        showError('Error ' + res.status + ': ' + errText);
        return;
      }

      const data = await res.json();
      const reply = (data.text || data.response || data.message || data.answer || '').toString();
      const cites = Array.isArray(data.citations) ? data.citations : [];

      appendMessage('assistant', reply, cites);
      history.push({ role: 'assistant', content: reply });

      /* TTS */
      if (window.speechSynthesis && reply) {
        const utt = new SpeechSynthesisUtterance(reply);
        utt.lang = isAmharic ? 'am-ET' : 'en-US';
        window.speechSynthesis.speak(utt);
      }

      /* Notify parent of content height change */
      const totalH = document.documentElement.scrollHeight;
      parent.postMessage({ type: 'resize', height: totalH }, '*');

    } catch (err) {
      removeThinking();
      messageList.setAttribute('aria-busy', 'false');
      showError('Could not reach the assistant. Please check your connection.');
      console.error('[Savanna widget] fetch error:', err);
    }
  }

  /* ── Voice input ─────────────────────────────────────────── */
  function setupVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      voiceBtn.setAttribute('aria-disabled', 'true');
      voiceBtn.setAttribute('title', 'Voice input not supported in this browser');
      voiceBtn.style.opacity = '0.4';
      return;
    }

    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = isAmharic ? 'am-ET' : 'en-US';

    recognition.addEventListener('result', function (e) {
      const transcript = e.results[0][0].transcript;
      chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + transcript;
      chatInput.dispatchEvent(new Event('input'));
    });

    recognition.addEventListener('end', function () {
      isListening = false;
      voiceBtn.setAttribute('aria-pressed', 'false');
      voiceBtn.setAttribute('aria-label', i18n[isAmharic ? 'am' : 'en'].voiceStart);
      voiceBtn.style.color = '';
    });

    recognition.addEventListener('error', function (e) {
      isListening = false;
      voiceBtn.setAttribute('aria-pressed', 'false');
      showError('Voice input error: ' + e.error);
    });

    voiceBtn.addEventListener('click', function () {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.lang = isAmharic ? 'am-ET' : 'en-US';
        recognition.start();
        isListening = true;
        voiceBtn.setAttribute('aria-pressed', 'true');
        voiceBtn.setAttribute('aria-label', i18n[isAmharic ? 'am' : 'en'].voiceStop);
        voiceBtn.style.color = 'var(--c-error)';
      }
    });
  }

  setupVoice();

  /* ── Escalation flow ─────────────────────────────────────── */
  let mediaStream = null;

  function openEscalModal() {
    escalModal.removeAttribute('hidden');
    modalConfirm.focus();
    /* Trap focus in modal */
    escalModal.addEventListener('keydown', trapFocus);
  }

  function closeEscalModal() {
    escalModal.setAttribute('hidden', '');
    escalModal.removeEventListener('keydown', trapFocus);
    escalateBtn.focus();
  }

  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    const focusable = escalModal.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    const first = focusable[0];
    const last  = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
    }
  }

  escalateBtn.addEventListener('click', openEscalModal);
  modalCancel.addEventListener('click', closeEscalModal);

  modalConfirm.addEventListener('click', async function () {
    closeEscalModal();
    try {
      /* Step 1: Request screen share */
      mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });

      /* Step 2: POST /escalate */
      const res = await fetch(apiUrl + '/escalate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          reason:     'User requested human assistance',
          language:   isAmharic ? 'am' : 'en'
        })
      });

      if (!res.ok) throw new Error('Escalation API error ' + res.status);
      const data = await res.json();
      const ticketId = data.ticket_id || data.id || 'N/A';

      /* Show confirmation */
      ticketZone.innerHTML = '';
      const conf = document.createElement('div');
      conf.className = 'ticket-confirm';
      conf.setAttribute('role', 'status');
      conf.textContent = '✓ Connected — Ticket #' + ticketId + '. An agent will join shortly.';
      ticketZone.appendChild(conf);

    } catch (err) {
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (err.name === 'NotAllowedError') {
        showError('Screen sharing was cancelled. You can try again.');
      } else {
        showError('Could not escalate: ' + err.message);
      }
    }
  });

  /* Close modal on backdrop click */
  escalModal.addEventListener('click', function (e) {
    if (e.target === escalModal) closeEscalModal();
  });

  /* ── Escape key ──────────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!escalModal.hidden) { closeEscalModal(); return; }
      parent.postMessage({ type: 'close' }, '*');
    }
  });

})();
</script>
</body>
</html>
